sections:
  - type: hero
    headline: About YETI Robotics
    bodyMarkdown: YETI began ten years ago with only 16 students and 7 mentors in Charlotte, North Carolina. YETI won multiple Chairman's awards for their efforts to engage the Charlotte community in STEM. YETI has founded many FIRST Tech Challenge and FIRST Lego League teams to continuously encourage students to join the team. YETI Robotics also co-founded the Queen City Robotics Alliance, a 501(c)3 organization, with BOW 4290,  T-Rex 4935, and Royal Robotics 3701. During the summer of 2019 in partnership with our very own PREPARE a 501(c)3 formed by our Business Co-Captain, we started an FLL team and an FTC team in southern INDIA
